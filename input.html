<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keuangan Harian</title>

  <link href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

  <style>
    body {
      font-family: Arial;
      background: linear-gradient(135deg, #2f80ed, #56ccf2);
      margin: 0;
    }
    .container {
      max-width: 1100px;
      margin: auto;
      padding: 15px;
    }
    .card {
      background: #fff;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }
    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid #ddd;
      box-sizing: border-box;
    }
    textarea {
      height: 100px;
      resize: vertical;
    }
    button {
      padding: 10px;
      margin-top: 8px;
      border: none;
      border-radius: 8px;
      background: #2f80ed;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
    }
    button:hover {
      background: #1366d6;
    }
    .total {
      font-size: 18px;
      font-weight: bold;
      color: #27ae60;
      margin: 10px 0;
    }
    .action {
      padding: 5px 8px;
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      width: auto;
      margin: 2px;
    }
    .edit { background: orange; }
    .delete { background: red; }

    .dataTables_wrapper {
      width: 100%;
      overflow-x: auto;
    }
    #table {
      width: 100% !important;
    }
    td, th {
      white-space: nowrap;
    }
    td:nth-child(5) {
      max-width: 200px;
      white-space: normal;
      word-break: break-word;
    }

    .filter-box {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    @media (max-width: 700px) {
      .filter-box {
        grid-template-columns: 1fr;
      }
      table {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
<div class="container">

  <div class="card">
    <h3>💰 Input Pengeluaran</h3>
    <form id="form">
      <input name="nama" placeholder="Nama Pengeluaran" required>
      <input name="harga" type="number" placeholder="Harga" required>
      <textarea name="keterangan" placeholder="Keterangan"></textarea>
      <input type="file" id="file" required>
      <button>Simpan</button>
    </form>
  </div>

  <div class="card">
    <h3>📊 Data Pengeluaran PT. SHW</h3>

    <div class="filter-box">
      <select id="modeFilter" onchange="aturTampilanFilter()">
        <option value="bulan" selected>Filter Bulanan</option>
        <option value="hari">Filter Harian</option>
        <option value="tahun">Filter Tahunan</option>
      </select>

      <input type="date" id="filterTanggal">
      <input type="month" id="filterBulan">
      <input type="number" id="filterTahun" placeholder="Contoh: 2026">
    </div>

    <button onclick="filterData()">Filter</button>
    <button onclick="loadData()">Reset ke Bulan Ini</button>

    <div class="total" id="total">Total: Rp 0</div>

    <table id="table" class="display">
      <thead>
        <tr>
          <th>Tanggal</th>
          <th>Jam</th>
          <th>Nama</th>
          <th>Harga</th>
          <th>Keterangan</th>
          <th>Gambar</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</div>

<script>
  const URL = "https://script.google.com/macros/s/AKfycbzduBIQLX88PJEj_9U-RsWw05PC1o_kMlRHz8We_T5VczaQjLC7ktXuhlu6iqv4blM/exec";

  let table = $('#table').DataTable({
    order: [[0, 'desc']],
    scrollX: true,
    autoWidth: false
  });

  function rupiah(a) {
    return 'Rp ' + Number(a || 0).toLocaleString('id-ID');
  }

  function formatTanggal(tgl) {
    return new Date(tgl).toLocaleDateString('id-ID', {
      timeZone: 'Asia/Jakarta',
      day: '2-digit',
      month: '2-digit',
      year: 'numeric'
    });
  }

  function formatFilter(tgl) {
    return new Date(tgl).toLocaleDateString('sv-SE', {
      timeZone: 'Asia/Jakarta'
    });
  }

  function getWaktu() {
    const now = new Date();
    return {
      tanggal: now.toLocaleDateString('sv-SE', { timeZone: 'Asia/Jakarta' }),
      jam: now.toLocaleTimeString('id-ID', {
        timeZone: 'Asia/Jakarta',
        hour12: false
      })
    };
  }

  function aturTampilanFilter() {
    const mode = document.getElementById('modeFilter').value;

    document.getElementById('filterTanggal').style.display = mode === 'hari' ? 'block' : 'none';
    document.getElementById('filterBulan').style.display = mode === 'bulan' ? 'block' : 'none';
    document.getElementById('filterTahun').style.display = mode === 'tahun' ? 'block' : 'none';
  }

  function setDefaultBulanIni() {
    const now = new Date();

    const bulanSekarang = now.toLocaleDateString('sv-SE', {
      timeZone: 'Asia/Jakarta',
      year: 'numeric',
      month: '2-digit'
    });

    const tahunSekarang = now.toLocaleDateString('sv-SE', {
      timeZone: 'Asia/Jakarta',
      year: 'numeric'
    });

    document.getElementById('modeFilter').value = 'bulan';
    document.getElementById('filterBulan').value = bulanSekarang;
    document.getElementById('filterTahun').value = tahunSekarang;

    aturTampilanFilter();
  }

  function loadData() {
    setDefaultBulanIni();
    filterData();
  }

  function filterData() {
    const mode = document.getElementById('modeFilter').value;
    const t = document.getElementById('filterTanggal').value;
    const b = document.getElementById('filterBulan').value;
    const y = document.getElementById('filterTahun').value;

    fetch(URL)
      .then(r => r.json())
      .then(data => {
        table.clear();
        let total = 0;

        data.forEach((row, i) => {
          const tglRow = formatFilter(row[0]);
          let cocok = false;

          if (mode === 'hari') {
            cocok = tglRow === t;
          }

          if (mode === 'bulan') {
            cocok = tglRow.substring(0, 7) === b;
          }

          if (mode === 'tahun') {
            cocok = tglRow.substring(0, 4) === y;
          }

          if (cocok) {
            total += Number(row[3] || 0);

            table.row.add([
              formatTanggal(row[0]),
              row[1],
              row[2],
              rupiah(row[3]),
              row[4],
              `<a href="${row[5]}" target="_blank">Lihat</a>`,
              `<button class="action edit" onclick="editRow(${i})">Edit</button>
               <button class="action delete" onclick="del(${i})">Hapus</button>`
            ]);
          }
        });

        table.draw();
        document.getElementById('total').innerText = 'Total: ' + rupiah(total);
      });
  }

  function del(i) {
    if (!confirm('Hapus data?')) return;

    fetch(URL, {
      method: 'POST',
      body: new URLSearchParams({
        action: 'delete',
        row: i
      })
    }).then(() => loadData());
  }

  function editRow(i) {
    fetch(URL)
      .then(r => r.json())
      .then(d => {
        const row = d[i];

        let nama = prompt('Nama', row[2]);
        if (nama === null) return;

        let harga = prompt('Harga', row[3]);
        if (harga === null) return;

        let ket = prompt('Keterangan', row[4]);
        if (ket === null) return;

        const waktu = getWaktu();

        const data = new URLSearchParams();
        data.append('action', 'edit');
        data.append('row', i);
        data.append('nama', nama);
        data.append('harga', harga);
        data.append('keterangan', ket);
        data.append('tanggal', waktu.tanggal);
        data.append('jam', waktu.jam);

        fetch(URL, {
          method: 'POST',
          body: data
        }).then(() => loadData());
      });
  }

  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();

    const file = document.getElementById('file').files[0];

    if (!file) {
      alert('File belum dipilih');
      return;
    }

    const r = new FileReader();

    r.onload = function () {
      const b = r.result.split(',')[1];
      const data = new FormData(e.target);
      const waktu = getWaktu();

      data.append('file', b);
      data.append('filename', file.name);
      data.append('mime', file.type);
      data.append('action', 'add');
      data.append('tanggal', waktu.tanggal);
      data.append('jam', waktu.jam);

      fetch(URL, {
        method: 'POST',
        body: data
      }).then(() => {
        alert('Tersimpan');
        e.target.reset();
        loadData();
      });
    };

    r.readAsDataURL(file);
  });

  loadData();
</script>

</body>
</html>
