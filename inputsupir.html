<!DOCTYPE html>

<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
Pengangkutan Kernel CRS2
</title>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  padding: 15px;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #f1f5f9;

  color: #1e293b;

}


.container {

  max-width: 850px;

  margin: auto;

}


.card {

  background: white;

  padding: 20px;

  margin-bottom: 18px;

  border-radius: 14px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.08);

}


h2 {

  margin-top: 0;

  margin-bottom: 18px;

}


label {

  display: block;

  font-weight: bold;

  margin-top: 12px;

  margin-bottom: 6px;

}


input {

  width: 100%;

  padding: 12px;

  border:
    1px solid #cbd5e1;

  border-radius: 8px;

  font-size: 15px;

  outline: none;

}


input:focus {

  border-color: #2563eb;

}


button {

  border: none;

  border-radius: 8px;

  padding: 11px 15px;

  font-size: 14px;

  font-weight: bold;

  cursor: pointer;

}


button:disabled {

  opacity: .6;

  cursor: not-allowed;

}


/* ===================== */
/* BUTTON */
/* ===================== */

.btn-blue {

  width: 100%;

  margin-top: 15px;

  background: #2563eb;

  color: white;

}


.btn-green {

  width: 100%;

  margin-top: 15px;

  background: #16a34a;

  color: white;

}


.btn-purple {

  width: 100%;

  margin-top: 15px;

  background: #7c3aed;

  color: white;

}


.btn-gray {

  background: #64748b;

  color: white;

  margin-top: 10px;

}


.btn-orange {

  background: #f59e0b;

  color: white;

}


.btn-red {

  background: #dc2626;

  color: white;

}


/* ===================== */
/* DRIVER LIST */
/* ===================== */

.driver-list {

  margin-top: 8px;

  border:
    1px solid #cbd5e1;

  border-radius: 8px;

  max-height: 300px;

  overflow-y: auto;

}


.driver {

  display: flex;

  align-items: center;

  gap: 10px;

  padding: 12px;

  border-bottom:
    1px solid #e2e8f0;

}


.driver:last-child {

  border-bottom: none;

}


.driver-checkbox {

  width: auto;

}


.driver-info {

  flex: 1;

}


.driver-name {

  font-weight: bold;

}


.driver-detail {

  color: #64748b;

  font-size: 13px;

  margin-top: 3px;

}


/* ===================== */
/* OUTPUT */
/* ===================== */

.output {

  background: #f8fafc;

  border:
    1px solid #cbd5e1;

  border-radius: 8px;

  padding: 15px;

  white-space: pre-wrap;

  line-height: 1.6;

  font-size: 15px;

}


/* ===================== */
/* DATABASE */
/* ===================== */

.database-item {

  display: flex;

  align-items: center;

  gap: 10px;

  padding: 12px 0;

  border-bottom:
    1px solid #e2e8f0;

}


.database-item:last-child {

  border-bottom: none;

}


.database-info {

  flex: 1;

}


.database-name {

  font-weight: bold;

}


.database-detail {

  color: #64748b;

  font-size: 13px;

  margin-top: 3px;

}


.actions {

  display: flex;

  gap: 5px;

}


/* ===================== */
/* STATUS */
/* ===================== */

.status {

  margin-top: 10px;

  padding: 10px;

  border-radius: 7px;

  display: none;

}


.status.success {

  display: block;

  background: #dcfce7;

  color: #166534;

}


.status.error {

  display: block;

  background: #fee2e2;

  color: #991b1b;

}


.loading {

  text-align: center;

  padding: 20px;

  color: #64748b;

}


/* ===================== */
/* RESPONSIVE */
/* ===================== */

@media(max-width:600px) {

  body {

    padding: 8px;

  }


  .card {

    padding: 15px;

  }


  .database-item {

    align-items: flex-start;

  }


  .actions {

    flex-direction: column;

  }

}

</style>

</head>


<body>


<div class="container">


<!-- ================================== -->
<!-- PENGANGKUTAN -->
<!-- ================================== -->

<div class="card">

<h2>
Pengangkutan Kernel
</h2>


<label>
Tujuan / Pabrik
</label>

<input
  id="tujuan"
  value="CRS2 -  ASMJ"
>


<label>
Tanggal
</label>

<input
  id="tanggal"
  readonly
>


<label>
Cari Nama Supir
</label>

<input
  id="searchDriver"
  placeholder="Ketik nama supir..."
>


<div
  id="driverList"
  class="driver-list"
>

<div class="loading">
Memuat database...
</div>

</div>


<div
  id="counter"
  style="
    margin-top:8px;
    color:#64748b;
    font-size:14px;
  "
>
0 supir dipilih
</div>


<button
  class="btn-gray"
  onclick="selectAll()"
>
☑ PILIH SEMUA
</button>


<button
  class="btn-blue"
  onclick="generateOutput()"
>
TAMPILKAN DATA
</button>

</div>


<!-- ================================== -->
<!-- HASIL -->
<!-- ================================== -->

<div class="card">

<h2>
Hasil
</h2>


<div
  id="output"
  class="output"
>
Silakan pilih supir terlebih dahulu.
</div>


<button
  class="btn-green"
  onclick="copyOutput()"
>
📋 COPY
</button>

</div>


<!-- ================================== -->
<!-- TAMBAH SUPIR -->
<!-- ================================== -->

<div class="card">

<h2>
Tambah Supir
</h2>


<label>
Nama Supir
</label>

<input
  id="namaBaru"
  placeholder="Contoh: IRMAN SYAHPUTRA SITORUS"
>


<label>
No Pol
</label>

<input
  id="nopolBaru"
  placeholder="Contoh: BM 8899 HJ"
>


<label>
No SIM/NIK
</label>

<input
  id="simnikBaru"
  placeholder="Contoh: 0914-9610-000572"
>


<button
  id="btnTambah"
  class="btn-purple"
  onclick="addDriver()"
>
+ TAMBAH SUPIR
</button>


<div
  id="status"
  class="status"
></div>

</div>


<!-- ================================== -->
<!-- DATABASE -->
<!-- ================================== -->

<div class="card">

<h2>
Database Supir
</h2>


<div
  id="databaseList"
>

<div class="loading">
Memuat database...
</div>

</div>

</div>


</div>


<script>


// ==================================================
// URL API GOOGLE APPS SCRIPT
// ==================================================

const API_URL =
"https://script.google.com/macros/s/AKfycby8y7s8a0zxQrD2YFKeEePy_tml_nSzcOj57eVJ6epUuyG9gG2s-YzqBW3RQ6I_YGs/exec";


// ==================================================
// DATA GLOBAL
// ==================================================

let drivers = [];


// ==================================================
// TANGGAL
// ==================================================

function setToday() {

  const now =
    new Date();


  document.getElementById(
    "tanggal"
  ).value =

    now.toLocaleDateString(
      "id-ID",
      {
        day: "2-digit",
        month: "long",
        year: "numeric"
      }
    );

}


// ==================================================
// LOAD DATABASE
// ==================================================

async function loadDrivers() {

  try {

    const response =
      await fetch(
        API_URL +
        "?action=getDrivers"
      );


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.message
      );

    }


    drivers =
      result.data || [];


    renderDrivers();

    renderDatabase();


  } catch (error) {

    console.error(error);


    document.getElementById(
      "driverList"
    ).innerHTML =

      `<div class="loading">
        Gagal mengambil database.
        <br>
        ${escapeHtml(error.message)}
      </div>`;


    document.getElementById(
      "databaseList"
    ).innerHTML =

      `<div class="loading">
        Gagal mengambil database.
      </div>`;

  }

}


// ==================================================
// RENDER PILIHAN SUPIR
// ==================================================

function renderDrivers() {

  const list =
    document.getElementById(
      "driverList"
    );


  const keyword =
    document.getElementById(
      "searchDriver"
    ).value
    .toLowerCase()
    .trim();


  const filtered =
    drivers.filter(
      driver =>

        driver.nama
          .toLowerCase()
          .includes(keyword)

    );


  list.innerHTML = "";


  if (
    filtered.length === 0
  ) {

    list.innerHTML =
      `<div class="loading">
        Belum ada data supir.
      </div>`;

    updateCounter();

    return;

  }


  filtered.forEach(
    driver => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "driver";


      const checkbox =
        document.createElement(
          "input"
        );


      checkbox.type =
        "checkbox";


      checkbox.className =
        "driver-checkbox";


      checkbox.dataset.nama =
        driver.nama;


      checkbox.addEventListener(
        "change",
        updateCounter
      );


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "driver-info";


      info.innerHTML =

        `<div class="driver-name">
          ${escapeHtml(driver.nama)}
        </div>

        <div class="driver-detail">
          ${escapeHtml(driver.nopol)}
          •
          ${escapeHtml(driver.simnik)}
        </div>`;


      info.onclick =
        function() {

          checkbox.checked =
            !checkbox.checked;

          updateCounter();

        };


      row.appendChild(
        checkbox
      );


      row.appendChild(
        info
      );


      list.appendChild(
        row
      );

    }
  );


  updateCounter();

}


// ==================================================
// SEARCH
// ==================================================

document
  .getElementById(
    "searchDriver"
  )
  .addEventListener(
    "input",
    renderDrivers
  );


// ==================================================
// COUNTER
// ==================================================

function updateCounter() {

  const total =
    document.querySelectorAll(
      ".driver-checkbox:checked"
    ).length;


  document.getElementById(
    "counter"
  ).textContent =

    total +
    " supir dipilih";

}


// ==================================================
// PILIH SEMUA
// ==================================================

function selectAll() {

  document
    .querySelectorAll(
      ".driver-checkbox"
    )
    .forEach(
      checkbox => {

        checkbox.checked =
          true;

      }
    );


  updateCounter();

}


// ==================================================
// GENERATE OUTPUT
// ==================================================

function generateOutput() {

  const selected =
    Array.from(
      document.querySelectorAll(
        ".driver-checkbox:checked"
      )
    );


  if (
    selected.length === 0
  ) {

    alert(
      "Silakan pilih minimal 1 supir."
    );

    return;

  }


  const tujuan =
    document.getElementById(
      "tujuan"
    ).value.trim();


  const tanggal =
    document.getElementById(
      "tanggal"
    ).value;


  let text = "";


  text +=
    selected.length +
    " Unit Pengangkutan Kernel " +
    tujuan +
    "\n";


  text +=
    "Tanggal : " +
    tanggal +
    "\n\n";


  selected.forEach(
    (checkbox, index) => {

      const driver =
        drivers.find(
          d =>
            d.nama ===
            checkbox.dataset.nama
        );


      if (!driver) return;


      text +=
        "Nama supir  : " +
        driver.nama +
        "\n";


      text +=
        "No pol.          : " +
        driver.nopol +
        "\n";


      text +=
        "No sim/NIK  : " +
        driver.simnik +
        "\n";


      if (
        index <
        selected.length - 1
      ) {

        text += "\n";

      }

    }
  );


  document.getElementById(
    "output"
  ).textContent =
    text;

}


// ==================================================
// COPY
// ==================================================

async function copyOutput() {

  const text =
    document.getElementById(
      "output"
    ).textContent;


  if (
    !text ||
    text ===
    "Silakan pilih supir terlebih dahulu."
  ) {

    alert(
      "Belum ada data untuk dicopy."
    );

    return;

  }


  try {

    await navigator.clipboard
      .writeText(text);


    alert(
      "Berhasil dicopy."
    );


  } catch (error) {

    const textarea =
      document.createElement(
        "textarea"
      );


    textarea.value =
      text;


    document.body.appendChild(
      textarea
    );


    textarea.select();


    document.execCommand(
      "copy"
    );


    textarea.remove();


    alert(
      "Berhasil dicopy."
    );

  }

}


// ==================================================
// TAMBAH SUPIR
// ==================================================

async function addDriver() {

  const nama =
    document.getElementById(
      "namaBaru"
    ).value.trim();


  const nopol =
    document.getElementById(
      "nopolBaru"
    ).value.trim();


  const simnik =
    document.getElementById(
      "simnikBaru"
    ).value.trim();


  if (
    !nama ||
    !nopol ||
    !simnik
  ) {

    showStatus(
      "Semua data harus diisi.",
      false
    );

    return;

  }


  const button =
    document.getElementById(
      "btnTambah"
    );


  button.disabled =
    true;


  button.textContent =
    "MENYIMPAN...";


  try {

    const url =
      API_URL +
      "?action=addDriver" +

      "&nama=" +
      encodeURIComponent(
        nama
      ) +

      "&nopol=" +
      encodeURIComponent(
        nopol
      ) +

      "&simnik=" +
      encodeURIComponent(
        simnik
      );


    const response =
      await fetch(url);


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.message
      );

    }


    showStatus(
      "Supir berhasil ditambahkan.",
      true
    );


    document.getElementById(
      "namaBaru"
    ).value = "";


    document.getElementById(
      "nopolBaru"
    ).value = "";


    document.getElementById(
      "simnikBaru"
    ).value = "";


    await loadDrivers();


  } catch (error) {

    console.error(error);


    showStatus(
      error.message,
      false
    );

  }


  button.disabled =
    false;


  button.textContent =
    "+ TAMBAH SUPIR";

}


// ==================================================
// RENDER DATABASE
// ==================================================

function renderDatabase() {

  const list =
    document.getElementById(
      "databaseList"
    );


  list.innerHTML = "";


  if (
    drivers.length === 0
  ) {

    list.innerHTML =
      `<div class="loading">
        Database masih kosong.
      </div>`;

    return;

  }


  drivers.forEach(
    driver => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "database-item";


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "database-info";


      info.innerHTML =

        `<div class="database-name">
          ${escapeHtml(driver.nama)}
        </div>

        <div class="database-detail">
          ${escapeHtml(driver.nopol)}
          •
          ${escapeHtml(driver.simnik)}
        </div>`;


      const actions =
        document.createElement(
          "div"
        );


      actions.className =
        "actions";


      const edit =
        document.createElement(
          "button"
        );


      edit.className =
        "btn-orange";


      edit.textContent =
        "EDIT";


      edit.onclick =
        function() {

          editDriver(
            driver.nama
          );

        };


      const del =
        document.createElement(
          "button"
        );


      del.className =
        "btn-red";


      del.textContent =
        "HAPUS";


      del.onclick =
        function() {

          deleteDriver(
            driver.nama
          );

        };


      actions.appendChild(
        edit
      );


      actions.appendChild(
        del
      );


      row.appendChild(
        info
      );


      row.appendChild(
        actions
      );


      list.appendChild(
        row
      );

    }
  );

}


// ==================================================
// EDIT
// ==================================================

async function editDriver(
  oldNama
) {

  const driver =
    drivers.find(
      d =>
        d.nama === oldNama
    );


  if (!driver) return;


  const nama =
    prompt(
      "Nama Supir:",
      driver.nama
    );


  if (nama === null)
    return;


  const nopol =
    prompt(
      "No Pol:",
      driver.nopol
    );


  if (nopol === null)
    return;


  const simnik =
    prompt(
      "No SIM/NIK:",
      driver.simnik
    );


  if (simnik === null)
    return;


  try {

    const url =
      API_URL +
      "?action=updateDriver" +

      "&oldNama=" +
      encodeURIComponent(
        oldNama
      ) +

      "&nama=" +
      encodeURIComponent(
        nama
      ) +

      "&nopol=" +
      encodeURIComponent(
        nopol
      ) +

      "&simnik=" +
      encodeURIComponent(
        simnik
      );


    const response =
      await fetch(url);


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.message
      );

    }


    showStatus(
      "Data berhasil diperbarui.",
      true
    );


    loadDrivers();


  } catch (error) {

    showStatus(
      error.message,
      false
    );

  }

}


// ==================================================
// HAPUS
// ==================================================

async function deleteDriver(
  nama
) {

  const yakin =
    confirm(
      "Hapus data supir:\n\n" +
      nama +
      "?"
    );


  if (!yakin)
    return;


  try {

    const url =
      API_URL +
      "?action=deleteDriver" +

      "&nama=" +
      encodeURIComponent(
        nama
      );


    const response =
      await fetch(url);


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.message
      );

    }


    showStatus(
      "Data berhasil dihapus.",
      true
    );


    loadDrivers();


  } catch (error) {

    showStatus(
      error.message,
      false
    );

  }

}


// ==================================================
// STATUS
// ==================================================

function showStatus(
  message,
  success
) {

  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    message;


  status.className =
    "status " +
    (
      success
        ? "success"
        : "error"
    );


  setTimeout(
    function() {

      status.className =
        "status";

    },
    4000
  );

}


// ==================================================
// SECURITY
// ==================================================

function escapeHtml(
  text
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text;


  return div.innerHTML;

}


// ==================================================
// START
// ==================================================

setToday();

loadDrivers();

</script>


</body>

</html>
