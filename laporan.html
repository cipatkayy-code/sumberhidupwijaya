<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Pengeluaran PT. SHW</title>

  <link href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #2f80ed, #56ccf2);
      margin: 0;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: #fff;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    h3 {
      margin-top: 0;
      font-size: 20px;
    }

    input, select {
      width: 100%;
      height: 42px;
      padding: 8px 12px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #ddd;
      box-sizing: border-box;
      font-size: 14px;
      background: #fff;
    }

    .filter-box {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
    }

    #filterTanggal,
    #filterBulan,
    #filterTahun,
    #modeFilter {
      max-width: 100%;
      min-width: 0;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #2f80ed;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
    }

    button:hover {
      background: #1366d6;
    }

    .total {
      font-size: 18px;
      font-weight: bold;
      color: #27ae60;
      margin: 12px 0;
    }

    .dataTables_wrapper {
      width: 100%;
      overflow-x: auto;
    }

    #table {
      width: 100% !important;
    }

    td, th {
      white-space: nowrap;
    }

    td:nth-child(5) {
      max-width: 220px;
      white-space: normal;
      word-break: break-word;
    }

    @media (max-width: 700px) {
      .container {
        padding: 10px;
      }

      .card {
        padding: 12px;
        border-radius: 14px;
      }

      h3 {
        font-size: 18px;
      }

      input, select {
        height: 40px;
        font-size: 13px;
      }

      button {
        font-size: 13px;
      }

      table {
        font-size: 11px;
      }

      .total {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
<div class="container">

  <div class="card">
    <h3>📊 Laporan Pengeluaran PT. SHW</h3>

    <div class="filter-box">
      <select id="modeFilter" onchange="aturTampilanFilter()">
        <option value="bulan" selected>Bulanan</option>
        <option value="hari">Harian</option>
        <option value="tahun">Tahunan</option>
      </select>

      <input type="date" id="filterTanggal">
      <input type="month" id="filterBulan">
      <input type="number" id="filterTahun" placeholder="Contoh: 2026">
    </div>

    <div class="btn-row">
      <button onclick="filterData()">Filter</button>
      <button onclick="loadData()">Reset</button>
    </div>

    <div class="total" id="total">Total: Rp 0</div>

    <table id="table" class="display">
      <thead>
        <tr>
          <th>Tanggal</th>
          <th>Jam</th>
          <th>Nama</th>
          <th>Harga</th>
          <th>Keterangan</th>
          <th>Gambar</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

  </div>

</div>

<script>
const URL = "https://script.google.com/macros/s/AKfycbzduBIQLX88PJEj_9U-RsWw05PC1o_kMlRHz8We_T5VczaQjLC7ktXuhlu6iqv4blM/exec";

let table = $('#table').DataTable({
  order: [[0, 'desc']],
  scrollX: true,
  autoWidth: false,
  pageLength: 10
});

function rupiah(a) {
  return 'Rp ' + Number(a || 0).toLocaleString('id-ID');
}

function formatTanggal(tgl) {
  return new Date(tgl).toLocaleDateString('id-ID', {
    timeZone: 'Asia/Jakarta',
    day: '2-digit',
    month: '2-digit',
    year: 'numeric'
  });
}

function formatFilter(tgl) {
  return new Date(tgl).toLocaleDateString('sv-SE', {
    timeZone: 'Asia/Jakarta'
  });
}

function aturTampilanFilter() {
  const mode = document.getElementById('modeFilter').value;

  document.getElementById('filterTanggal').style.display = mode === 'hari' ? 'block' : 'none';
  document.getElementById('filterBulan').style.display = mode === 'bulan' ? 'block' : 'none';
  document.getElementById('filterTahun').style.display = mode === 'tahun' ? 'block' : 'none';
}

function setDefaultBulanIni() {
  const now = new Date();

  const bulanSekarang = now.toLocaleDateString('sv-SE', {
    timeZone: 'Asia/Jakarta',
    year: 'numeric',
    month: '2-digit'
  });

  const tahunSekarang = now.toLocaleDateString('sv-SE', {
    timeZone: 'Asia/Jakarta',
    year: 'numeric'
  });

  document.getElementById('modeFilter').value = 'bulan';
  document.getElementById('filterBulan').value = bulanSekarang;
  document.getElementById('filterTahun').value = tahunSekarang;

  aturTampilanFilter();
}

function loadData() {
  setDefaultBulanIni();
  filterData();
}

function filterData() {
  const mode = document.getElementById('modeFilter').value;
  const tanggal = document.getElementById('filterTanggal').value;
  const bulan = document.getElementById('filterBulan').value;
  const tahun = document.getElementById('filterTahun').value;

  fetch(URL)
    .then(r => r.json())
    .then(data => {
      table.clear();
      let total = 0;

      data.forEach(row => {
        const tglRow = formatFilter(row[0]);
        let cocok = false;

        if (mode === 'hari') {
          cocok = tglRow === tanggal;
        }

        if (mode === 'bulan') {
          cocok = tglRow.substring(0, 7) === bulan;
        }

        if (mode === 'tahun') {
          cocok = tglRow.substring(0, 4) === tahun;
        }

        if (cocok) {
          total += Number(row[3] || 0);

          table.row.add([
            formatTanggal(row[0]),
            row[1],
            row[2],
            rupiah(row[3]),
            row[4],
            `<a href="${row[5]}" target="_blank">Lihat</a>`
          ]);
        }
      });

      table.draw();
      document.getElementById('total').innerText = 'Total: ' + rupiah(total);
    })
    .catch(err => {
      alert('Gagal memuat data');
      console.error(err);
    });
}

loadData();
</script>

</body>
</html>
